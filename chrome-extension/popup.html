<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { width: 360px; font-family: -apple-system, sans-serif; font-size: 13px; margin: 0; padding: 8px; }
  h1 { font-size: 14px; margin: 4px 0 8px; }
  .item { border-bottom: 1px solid #ddd; padding: 8px 0; }
  .item:last-child { border-bottom: none; }
  .host { font-weight: 600; }
  .sample { color: #666; word-break: break-all; font-size: 11px; margin: 4px 0; }
  .count { color: #999; font-size: 11px; }
  .scope { margin-top: 6px; }
  .scope label { display: flex; align-items: center; gap: 4px; color: #666; font-size: 11px; }
  .scope input { flex: 1; min-width: 0; font-size: 11px; padding: 2px 4px; }
  .actions { margin-top: 6px; }
  button { margin-right: 6px; padding: 4px 10px; cursor: pointer; }
  .empty { color: #666; padding: 12px 0; text-align: center; }
  footer { margin-top: 8px; text-align: right; }
  footer a { font-size: 11px; color: #666; }
</style>
</head>
<body>
  <h1>Rotten</h1>
  <div id="list"></div>
  <footer><a href="options.html" target="_blank">View Rules</a></footer>
  <script src="popup.js"></script>
</body>
</html>
